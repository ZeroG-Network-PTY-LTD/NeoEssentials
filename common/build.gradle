plugins {
    id 'java-library'
    id 'maven-publish'
}

archivesBaseName = 'neoessentials-common'

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    // No Minecraft dependencies here - this is pure Java code
    
    // Common libraries used across versions
    api 'com.google.code.gson:gson:2.10.1'
    api 'org.apache.commons:commons-lang3:3.12.0'
}

// Source compatibility - we'll use Java 17 features as the minimum
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Common module should have all platform-independent code
// This includes utilities, data models, and common interfaces

// This helps ensure we don't accidentally include platform-specific code in common module
tasks.register('checkPlatformImports') {
    description = 'Check for platform-specific imports in common code'
    
    doLast {
        def forbiddenPackages = [
            'net.minecraft',
            'net.neoforged',
            'net.minecraftforge',
            'cpw.mods'
        ]
        
        def violations = []
        
        sourceSets.main.allJava.each { file ->
            file.eachLine { line, lineNumber ->
                forbiddenPackages.each { pkg ->
                    if (line.contains("import ${pkg}")) {
                        violations.add("${file.name}:${lineNumber}: Found platform-specific import: ${line.trim()}")
                    }
                }
            }
        }
        
        if (!violations.isEmpty()) {
            violations.each { println it }
            throw new GradleException("Found ${violations.size()} platform-specific imports in common code")
        }
    }
}

// Run the check during the build process
check.dependsOn tasks.checkPlatformImports
