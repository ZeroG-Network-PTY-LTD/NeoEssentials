name: Build & Release Jar

# Builds the mod jar for a dev branch and publishes it as that branch's
# "latest" GitHub Release — no need to run gradle locally to grab a build.
# The correct JDK per branch (21 for Dev-Builds' MC 1.21.1, 25 for
# mc-26.1-port's MC 26.1.2) is auto-provisioned by Gradle's own toolchain
# resolver (org.gradle.toolchains.foojay-resolver-convention, already
# configured in settings.gradle) — the runner JDK below is only what launches
# Gradle itself, not what compiles the mod.

on:
  push:
    branches:
      - Dev-Builds
      - mc-26.1-port
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build jar
        run: ./gradlew build -x test --console=plain

      # build_number.txt is tracked in git (not gitignored) so this counter survives across
      # both local dev builds and CI runs instead of each fresh CI checkout starting from 0 —
      # that mismatch used to make every CI build report "build.1" regardless of how far along
      # local builds had gotten. Gradle already incremented it during the build above; this
      # just commits that new value back so the next build (local or CI) continues from it.
      # Uses the default GITHUB_TOKEN checkout already authenticated with — pushes made with it
      # don't re-trigger this workflow's `push` event, so this can't cause a build loop.
      # continue-on-error: this push can fail on its own (e.g. branch-protection rejecting the
      # default token until GitHub Actions is added as a bypass actor) and that must NOT skip
      # the actual jar release below — a build-number sync hiccup is far less important than
      # publishing the build.
      - name: Commit updated build number
        continue-on-error: true
        run: |
          if git diff --quiet -- build_number.txt; then
            echo "build_number.txt unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_number.txt
          git commit -m "chore: bump build number to $(cat build_number.txt) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Locate built jar
        id: jar
        run: |
          jar_path=$(ls -t build/libs/*.jar | head -n 1)
          echo "path=${jar_path}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${jar_path}")" >> "$GITHUB_OUTPUT"

      - name: Publish branch release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.ref_name }}
          name: "${{ github.ref_name }} — latest automated build"
          body: |
            Automated build from commit ${{ github.sha }} on `${{ github.ref_name }}`.

            This release is overwritten on every push to this branch — it always
            reflects the latest commit, not a specific version.
          target_commitish: ${{ github.sha }}
          files: ${{ steps.jar.outputs.path }}
          prerelease: true
          make_latest: false

      # Posts the built jar straight into a Discord channel via webhook, in addition to the
      # GitHub Release above. Requires a repo secret DISCORD_BUILDS_WEBHOOK_URL (Discord channel
      # → Edit Channel → Integrations → Webhooks → Copy URL). Skipped (not failed) if that
      # secret isn't configured, so forks / other clones of this workflow don't break.
      # continue-on-error: a Discord outage or an oversized jar (webhook attachments cap out at
      # 8-100MB depending on the server's boost level) shouldn't fail the actual release.
      - name: Post build to Discord
        continue-on-error: true
        env:
          DISCORD_BUILDS_WEBHOOK_URL: ${{ secrets.DISCORD_BUILDS_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMPARE_URL: ${{ github.event.compare }}
        run: |
          # The secrets context can't be referenced in a step-level `if:` (GitHub Actions
          # rejects it at workflow-parse time — "Unrecognized named-value: 'secrets'"), so the
          # no-op-when-unset check happens here in the script instead.
          if [ -z "$DISCORD_BUILDS_WEBHOOK_URL" ]; then
            echo "DISCORD_BUILDS_WEBHOOK_URL not set — skipping Discord notification."
            exit 0
          fi
          # jq builds the JSON payload so quotes/newlines/backslashes in the commit message
          # (or anything else user-controlled) can't break or inject into the request body.
          payload=$(jq -n --arg branch "$BRANCH" --arg sha "${SHORT_SHA:0:7}" \
            --arg msg "$COMMIT_MSG" --arg url "$COMPARE_URL" \
            '{content: "**\($branch)** — new build (`\($sha)`)\n\($msg)\n\($url)"}')
          curl -sS -f \
            -F "payload_json=${payload}" \
            -F "file=@${{ steps.jar.outputs.path }};filename=${{ steps.jar.outputs.name }}" \
            "$DISCORD_BUILDS_WEBHOOK_URL"
