name: Build & Release Jar

# Builds the mod jar for a dev branch and publishes it as its own GitHub Release, tagged
# build-<branch>-<build number> — a new release per build, not one shared/overwritten release
# per branch — so no need to run gradle locally to grab a build.
# The correct JDK per branch (21 for Dev-Builds' MC 1.21.1, 25 for
# mc-26.1-port's MC 26.1.2) is auto-provisioned by Gradle's own toolchain
# resolver (org.gradle.toolchains.foojay-resolver-convention, already
# configured in settings.gradle) — the runner JDK below is only what launches
# Gradle itself, not what compiles the mod.

on:
  push:
    branches:
      - Dev-Builds
      - mc-26.1-port
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The build number used for this release's tag/name is whatever is committed in
      # build_number.txt AT THIS COMMIT — captured before the build runs. Deliberately NOT
      # read from the file after ./gradlew build: Gradle's own local-dev convenience bump
      # (build.gradle's taskGraph.whenReady hook, still handy for solo local testing) would
      # otherwise increment it inside this ephemeral runner checkout, and if that bumped
      # value got used for the tag, this workflow would need to commit it back — which is
      # exactly the per-branch-independent auto-bump that made Dev-Builds and mc-26.1-port's
      # build numbers drift apart in the first place (each branch's CI run bumped its own
      # copy on its own schedule, with nothing keeping the two in sync).
      #
      # Build numbers are now a deliberate, manually-set value: bumped once, applied
      # identically to both branches' build_number.txt in the same commit/cherry-pick that
      # ships the change. CI just reads and publishes that number — it does not own it.
      - name: Read build number
        id: build_number
        run: echo "value=$(cat build_number.txt)" >> "$GITHUB_OUTPUT"

      - name: Build jar
        run: ./gradlew build -x test --console=plain

      - name: Locate built jar
        id: jar
        run: |
          jar_path=$(ls -t build/libs/*.jar | head -n 1)
          echo "path=${jar_path}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${jar_path}")" >> "$GITHUB_OUTPUT"

      # One release PER BUILD now (unique tag = branch + build number), instead of one release
      # per branch that gets overwritten every push. The old scheme reused the same tag
      # (build-<branch>) forever, so GitHub only ever fired a release "released" webhook event
      # once — every subsequent push just "edited" that same release, which a Discord bot (or
      # any webhook consumer) watching for "released" never saw again. Each build now gets its
      # own tag/release, so "released" fires fresh every time.
      - name: Publish build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.ref_name }}-${{ steps.build_number.outputs.value }}
          name: "${{ github.ref_name }} — build ${{ steps.build_number.outputs.value }}"
          body: |
            Automated build from commit ${{ github.sha }} on `${{ github.ref_name }}`.
          target_commitish: ${{ github.sha }}
          files: ${{ steps.jar.outputs.path }}
          prerelease: true
          make_latest: false

      # Posts the built jar straight into a Discord channel via webhook, in addition to the
      # GitHub Release above. Requires a repo secret DISCORD_BUILDS_WEBHOOK_URL (Discord channel
      # → Edit Channel → Integrations → Webhooks → Copy URL). Skipped (not failed) if that
      # secret isn't configured, so forks / other clones of this workflow don't break.
      # continue-on-error: a Discord outage or an oversized jar (webhook attachments cap out at
      # 8-100MB depending on the server's boost level) shouldn't fail the actual release.
      - name: Post build to Discord
        continue-on-error: true
        env:
          DISCORD_BUILDS_WEBHOOK_URL: ${{ secrets.DISCORD_BUILDS_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMPARE_URL: ${{ github.event.compare }}
        run: |
          # The secrets context can't be referenced in a step-level `if:` (GitHub Actions
          # rejects it at workflow-parse time — "Unrecognized named-value: 'secrets'"), so the
          # no-op-when-unset check happens here in the script instead.
          if [ -z "$DISCORD_BUILDS_WEBHOOK_URL" ]; then
            echo "DISCORD_BUILDS_WEBHOOK_URL not set — skipping Discord notification."
            exit 0
          fi
          # jq builds the JSON payload so quotes/newlines/backslashes in the commit message
          # (or anything else user-controlled) can't break or inject into the request body.
          payload=$(jq -n --arg branch "$BRANCH" --arg sha "${SHORT_SHA:0:7}" \
            --arg msg "$COMMIT_MSG" --arg url "$COMPARE_URL" \
            '{content: "**\($branch)** — new build (`\($sha)`)\n\($msg)\n\($url)"}')
          curl -sS -f \
            -F "payload_json=${payload}" \
            -F "file=@${{ steps.jar.outputs.path }};filename=${{ steps.jar.outputs.name }}" \
            "$DISCORD_BUILDS_WEBHOOK_URL"
