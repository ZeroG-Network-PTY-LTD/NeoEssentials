name: Build & Release Jar

# Builds the mod jar for a dev branch and publishes it as its own GitHub Release, tagged
# build-<branch>-<build number> — a new release per build, not one shared/overwritten release
# per branch — so no need to run gradle locally to grab a build. The build number is shared
# across Dev-Builds and mc-26.1-port (see "Bump shared build number" below), not tracked
# independently per branch.
# The correct JDK per branch (21 for Dev-Builds' MC 1.21.1, 25 for
# mc-26.1-port's MC 26.1.2) is auto-provisioned by Gradle's own toolchain
# resolver (org.gradle.toolchains.foojay-resolver-convention, already
# configured in settings.gradle) — the runner JDK below is only what launches
# Gradle itself, not what compiles the mod.

on:
  push:
    branches:
      - Dev-Builds
      - mc-26.1-port
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build numbers are shared across BOTH dev branches, not tracked independently per
      # branch: this bumps to one higher than the highest build_number.txt committed on
      # EITHER Dev-Builds or mc-26.1-port (whichever branch this run is for, its own committed
      # value is also considered, in case it's somehow already ahead), then commits that back
      # to build_number.txt on the branch that triggered this run.
      #
      # A prior version of this used a plain independent per-branch auto-bump, which was
      # removed because it let the two branches' numbers drift apart from each other (each
      # branch's CI bumping its own copy on its own schedule, nothing keeping them in sync).
      # Computing the next number from the max across both branches every time keeps builds
      # in lockstep — whichever branch ships next just takes the next number in the shared
      # sequence — without needing the two branches to coordinate any other way.
      #
      # [skip ci] on the commit message is required: without it, this bump-and-push would
      # itself trigger another `push` run of this same workflow, forever.
      - name: Bump shared build number
        id: build_number
        run: |
          git fetch origin Dev-Builds mc-26.1-port
          n_dev=$(git show origin/Dev-Builds:build_number.txt 2>/dev/null || echo 0)
          n_port=$(git show origin/mc-26.1-port:build_number.txt 2>/dev/null || echo 0)
          n_here=$(cat build_number.txt 2>/dev/null || echo 0)
          max=$n_dev
          [ "$n_port" -gt "$max" ] && max=$n_port
          [ "$n_here" -gt "$max" ] && max=$n_here
          next=$((max + 1))
          echo "$next" > build_number.txt
          echo "value=$next" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build_number.txt
          git commit -m "Bump shared build number to ${next} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build jar
        run: ./gradlew build -x test --console=plain

      - name: Locate built jar
        id: jar
        run: |
          jar_path=$(ls -t build/libs/*.jar | head -n 1)
          echo "path=${jar_path}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${jar_path}")" >> "$GITHUB_OUTPUT"

      # One release PER BUILD now (unique tag = branch + build number), instead of one release
      # per branch that gets overwritten every push. The old scheme reused the same tag
      # (build-<branch>) forever, so GitHub only ever fired a release "released" webhook event
      # once — every subsequent push just "edited" that same release, which a Discord bot (or
      # any webhook consumer) watching for "released" never saw again. Each build now gets its
      # own tag/release, so "released" fires fresh every time.
      - name: Publish build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.ref_name }}-${{ steps.build_number.outputs.value }}
          name: "${{ github.ref_name }} — build ${{ steps.build_number.outputs.value }}"
          body: |
            Automated build from commit ${{ github.sha }} on `${{ github.ref_name }}`.
          target_commitish: ${{ github.sha }}
          files: ${{ steps.jar.outputs.path }}
          prerelease: true
          make_latest: false

      # Posts a rich embed to a Discord channel via webhook, linking straight to the GitHub
      # Release asset above rather than uploading the jar through the webhook itself — Discord
      # webhook file attachments cap out at 8-100MB depending on the server's boost level, and
      # this project's jars routinely exceed that (HTTP 413). A GitHub release asset has no such
      # cap, and clicking the link/filename downloads the jar directly from GitHub.
      # Requires a repo secret DISCORD_BUILDS_WEBHOOK_URL (Discord channel → Edit Channel →
      # Integrations → Webhooks → Copy URL). Skipped (not failed) if that secret isn't
      # configured, so forks / other clones of this workflow don't break.
      # continue-on-error: a Discord outage shouldn't fail the actual release.
      - name: Post build to Discord
        continue-on-error: true
        env:
          DISCORD_BUILDS_WEBHOOK_URL: ${{ secrets.DISCORD_BUILDS_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
          JAR_NAME: ${{ steps.jar.outputs.name }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
          REPO: ${{ github.repository }}
        run: |
          # The secrets context can't be referenced in a step-level `if:` (GitHub Actions
          # rejects it at workflow-parse time — "Unrecognized named-value: 'secrets'"), so the
          # no-op-when-unset check happens here in the script instead.
          if [ -z "$DISCORD_BUILDS_WEBHOOK_URL" ]; then
            echo "DISCORD_BUILDS_WEBHOOK_URL not set — skipping Discord notification."
            exit 0
          fi
          # GitHub's release-asset download URL is fully predictable from the tag + filename —
          # no need to parse it back out of the release-creation step's output. Hitting this URL
          # (e.g. clicking it in Discord) downloads the jar directly, no GitHub UI involved.
          TAG="build-${BRANCH}-${BUILD_NUMBER}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${JAR_NAME}"
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", $(stat -c%s "$JAR_PATH") / 1048576 }")
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # jq builds the JSON payload so quotes/brackets in the branch/jar name (or anything
          # else user-controlled) can't break or inject into the request body.
          payload=$(jq -n \
            --arg branch "$BRANCH" \
            --arg release_title "${BRANCH} — build ${BUILD_NUMBER}" \
            --arg jar_name "$JAR_NAME" \
            --arg url "$DOWNLOAD_URL" \
            --arg size "${SIZE_MB} MB" \
            --arg ts "$TIMESTAMP" \
            '{
              embeds: [{
                author: { name: "NeoEssentials" },
                title: "🆕 Dev Release",
                color: 5793266,  # 0x5865F2 — Discord blurple
                url: $url,
                fields: [ { name: "Branch", value: $branch, inline: true } ],
                description: ("**" + $release_title + "**\n[" + $jar_name + "](" + $url + ")\n" + $size + " • [Download](" + $url + ")"),
                timestamp: $ts
              }]
            }')
          curl -sS -f \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_BUILDS_WEBHOOK_URL"
