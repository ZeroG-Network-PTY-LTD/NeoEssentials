# NeoEssentials TABLike Tablist Configuration
# Based on TAB plugin feature set

[tablist]
# Enable the tab system
enabled = true

# How often to update the tab list (in milliseconds)
update_interval = 1000

# Format for displaying time (%H:%M:%S format)
time_format = "HH:mm:ss"

# Date format (%Y/%m/%d format)
date_format = "yyyy/MM/dd"

[tablist.header_footer]
# Enable header/footer feature
enabled = true

# Tab header (supports placeholders)
header = [
    "&3&l&m=====&r &b&lNeo&f&lEssentials &3&l&m=====&r",
    "&7Welcome &f%player% &7to the server!",
    "&7Server time: &f%time%",
    "&7Online players: &f%online%/%max%"
]

# Tab footer (supports placeholders)
footer = [
    "",
    "&7Website: &bwww.example.com",
    "&7Server TPS: &f%tps%",
    "&7Memory: &f%memory_used% MB",
    "&3&l&m========================="
]

[tablist.nametags]
# Enable nametag feature
enabled = true

# Whether to use team colors
use_team_colors = true

# Format for nametags (prefix and suffix)
[tablist.nametags.groups]
admin = { prefix = "&c[Admin] ", suffix = " &7✦", color = "red" }
mod = { prefix = "&2[Mod] ", suffix = " &7⚑", color = "green" }
vip = { prefix = "&6[VIP] ", suffix = " &e✪", color = "gold" }
default = { prefix = "", suffix = "", color = "gray" }

[tablist.player_list]
# Enable playerlist customization
enabled = true

# Format for the tab player list items
[tablist.player_list.groups]
admin = { prefix = "&c[Admin] ", suffix = " &7✦", color = "red" }
mod = { prefix = "&2[Mod] ", suffix = " &7⚑", color = "green" }
vip = { prefix = "&6[VIP] ", suffix = " &e✪", color = "gold" }
default = { prefix = "", suffix = "", color = "gray" }

# Fake players for empty slots (set to [] to disable)
placeholders = []

# Sorting options (true = enabled)
sort_by_name = true
sort_by_group = false

# Sort groups by weight (higher is displayed first)
[tablist.player_list.group_weights]
admin = 100
mod = 90
vip = 80
default = 0

# Custom ping values (-1 to use real ping)
[tablist.player_list.ping_spoof]
enabled = false
value = 0

# Global playerlist (false = per-world)
global_playerlist = true

# Hide spectator mode players from tab
hide_spectators = false

[tablist.scoreboard]
# Enable scoreboard feature
enabled = true

# Default scoreboard animation interval (ms)
animation_interval = 2000

# Format for the scoreboard
[tablist.scoreboard.templates.default]
title = "&b&lServer Stats"
lines = [
    "&7&m                     ",
    "&fPlayer: &b%player%",
    "&fRank: &b%group%",
    "&fPing: &b%ping%ms",
    "&fHealth: &b%health%",
    "&fWorld: &b%world%",
    "",
    "&fOnline: &b%online%/%max%",
    "&fServer TPS: &b%tps%",
    "&7&m                     ",
    "&bwww.example.com"
]

# Group-specific scoreboards
[tablist.scoreboard.templates.admin]
title = "&c&lAdmin View"
lines = [
    "&7&m                     ",
    "&fPlayer: &c%player%",
    "&fRank: &cAdmin",
    "&fPing: &c%ping%ms",
    "&fHealth: &c%health%",
    "&fWorld: &c%world%",
    "",
    "&fOnline: &c%online%/%max%",
    "&fServer TPS: &c%tps%",
    "&fMemory: &c%memory_used%/%memory_max% MB",
    "&7&m                     ",
    "&cwww.example.com"
]

[tablist.belowname]
# Enable below name (health) feature
enabled = false
format = "&c❤ %health%"

[tablist.bossbar]
# Enable bossbar feature
enabled = false

[[tablist.bossbar.bars]]
name = "welcome"
title = "&b&lWelcome to the server!"
color = "blue"
style = "progress"
progress = 100
visible_time = 60

[[tablist.bossbar.bars]]
name = "server_info"
title = "TPS: %tps% | Memory: %memory_used% MB"
color = "green"
style = "progress"
progress-exp = "tps * 5" # Dynamic progress based on TPS
visible_time = -1 # Always visible
