# NeoEssentials English (US) Language File
# Default language for the mod

# General messages
general.prefix=&6[NeoEssentials]&r
general.no_permission=&cYou don't have permission to do that!
general.player_only=&cThis command can only be used by players!
general.invalid_player=&cPlayer '{PLAYER}' not found!
general.success=&aSuccess!
general.error=&cAn error occurred!

# Language system messages
language.changed=&aYour language has been changed to {LANGUAGE}!
language.reload_success=&aLanguage files reloaded successfully!
language.not_found=&cLanguage '{LANGUAGE}' not available!
language.test_key=&6Testing key: &f{KEY}

# Command messages
command.language.changed=&aLanguage changed to {LANGUAGE}!
command.language.list_header=&6&l=== Available Languages ===
command.language.list_current=&a► {LANGUAGE_NAME} &8({LANGUAGE_CODE})
command.language.list_available=&7- {LANGUAGE_NAME} &8({LANGUAGE_CODE})
command.language.stats_header=&6&l=== Language Statistics ===
command.language.stats_available=&eAvailable Languages: &f{COUNT}
command.language.stats_default=&eDefault Language: &f{LANGUAGE}
command.language.stats_players=&ePlayers with Custom Locales: &f{COUNT}

# Home system messages
home.set=&aHome '{HOME}' set at your current location!
home.deleted=&aHome '{HOME}' deleted!
home.teleported=&aTeleported to home '{HOME}'!
home.not_found=&cHome '{HOME}' not found!
home.list_header=&6Your homes:
home.list_item=&7- &f{HOME} &8({WORLD} at {X}, {Y}, {Z})

# Warp system messages
warp.created=&aWarp '{WARP}' created at your current location!
warp.deleted=&aWarp '{WARP}' deleted!
warp.teleported=&aTeleported to warp '{WARP}'!
warp.not_found=&cWarp '{WARP}' not found!
warp.list_header=&6Available warps:
warp.list_item=&7- &f{WARP} &8({WORLD} at {X}, {Y}, {Z})

# Economy messages
economy.balance=&aYour balance: &f${BALANCE}
economy.balance_other=&a{PLAYER}'s balance: &f${BALANCE}
economy.pay_sent=&aYou sent &f${AMOUNT} &ato {PLAYER}!
economy.pay_received=&aYou received &f${AMOUNT} &afrom {PLAYER}!
economy.insufficient_funds=&cInsufficient funds! You need ${AMOUNT} more.

# Notification messages
notification.sent=&aNotification sent successfully!
notification.discord_sent=&aDiscord notification sent to channel!
notification.email_sent=&aEmail notification sent!
notification.log_sent=&aLog notification recorded!

# Error messages
error.file_not_found=&cFile not found: {FILE}
error.database_connection=&cDatabase connection failed!
error.config_load=&cFailed to load configuration!
error.permission_denied=&cPermission denied!

# Success messages
success.player_found=&aPlayer {PLAYER} found!
success.teleport=&aTeleported successfully!
success.config_saved=&aConfiguration saved!
success.data_loaded=&aData loaded successfully!
