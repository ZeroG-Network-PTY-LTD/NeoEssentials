# NeoEssentials French (France) Language File
# Fichier de langue française pour NeoEssentials

# Messages généraux
general.prefix=&6[NeoEssentials]&r
general.no_permission=&cVous n'avez pas la permission de faire cela !
general.player_only=&cCette commande ne peut être utilisée que par des joueurs !
general.invalid_player=&cJoueur '{PLAYER}' introuvable !
general.success=&aSuccès !
general.error=&cUne erreur s'est produite !

# Messages du système de langues
language.changed=&aVotre langue a été changée en {LANGUAGE} !
language.reload_success=&aFichiers de langue rechargés avec succès !
language.not_found=&cLangue '{LANGUAGE}' non disponible !
language.test_key=&6Test de la clé : &f{KEY}

# Messages des commandes
command.language.changed=&aLangue changée en {LANGUAGE} !
command.language.list_header=&6&l=== Langues Disponibles ===
command.language.list_current=&a► {LANGUAGE_NAME} &8({LANGUAGE_CODE})
command.language.list_available=&7- {LANGUAGE_NAME} &8({LANGUAGE_CODE})
command.language.stats_header=&6&l=== Statistiques des Langues ===
command.language.stats_available=&eLangues Disponibles : &f{COUNT}
command.language.stats_default=&eLangue par Défaut : &f{LANGUAGE}
command.language.stats_players=&eJoueurs avec Langues Personnalisées : &f{COUNT}

# Messages du système de maisons
home.set=&aMaison '{HOME}' définie à votre position actuelle !
home.deleted=&aMaison '{HOME}' supprimée !
home.teleported=&aTéléporté à la maison '{HOME}' !
home.not_found=&cMaison '{HOME}' introuvable !
home.list_header=&6Vos maisons :
home.list_item=&7- &f{HOME} &8({WORLD} à {X}, {Y}, {Z})

# Messages du système de warps
warp.created=&aWarp '{WARP}' créé à votre position actuelle !
warp.deleted=&aWarp '{WARP}' supprimé !
warp.teleported=&aTéléporté au warp '{WARP}' !
warp.not_found=&cWarp '{WARP}' introuvable !
warp.list_header=&6Warps disponibles :
warp.list_item=&7- &f{WARP} &8({WORLD} à {X}, {Y}, {Z})

# Messages d'économie
economy.balance=&aVotre solde : &f${BALANCE}
economy.balance_other=&aSolde de {PLAYER} : &f${BALANCE}
economy.pay_sent=&aVous avez envoyé &f${AMOUNT} &aà {PLAYER} !
economy.pay_received=&aVous avez reçu &f${AMOUNT} &ade {PLAYER} !
economy.insufficient_funds=&cFonds insuffisants ! Vous avez besoin de ${AMOUNT} de plus.

# Messages de notifications
notification.sent=&aNotification envoyée avec succès !
notification.discord_sent=&aNotification Discord envoyée au canal !
notification.email_sent=&aNotification par email envoyée !
notification.log_sent=&aNotification de log enregistrée !

# Messages d'erreur
error.file_not_found=&cFichier introuvable : {FILE}
error.database_connection=&cÉchec de la connexion à la base de données !
error.config_load=&cÉchec du chargement de la configuration !
error.permission_denied=&cPermission refusée !

# Messages de succès
success.player_found=&aJoueur {PLAYER} trouvé !
success.teleport=&aTéléportation réussie !
success.config_saved=&aConfiguration sauvegardée !
success.data_loaded=&aDonnées chargées avec succès !
