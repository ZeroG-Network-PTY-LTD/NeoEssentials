# Default Animations Configuration
# This file defines animations that can be used in tablist headers/footers

# Animation types
animations:
  # Scroll animation - scrolls text horizontally
  scroll:
    frames: 5
    speed: 2
    direction: "right"
    
  # Flash animation - flashes between colors
  flash:
    colors:
      - "&c"  # Red
      - "&6"  # Gold
      - "&e"  # Yellow
      - "&a"  # Green
      - "&b"  # Aqua
    interval: 500  # ms between color changes
    
  # Rainbow animation - smoothly transitions through colors
  rainbow:
    speed: 1000  # Complete cycle time in ms
    intensity: 1.0  # Color intensity
    
  # Fade animation - fades text in and out
  fade:
    fade_in: 500    # Fade in time in ms
    stay: 2000      # Stay time in ms
    fade_out: 500   # Fade out time in ms
    
# Animation sequences - predefined animations ready to use
sequences:
  welcome:
    type: "scroll"
    text: "&6&l Welcome to the server! "
    
  server_name:
    type: "rainbow"
    text: "&l NeoEssentials "
    
  online_players:
    type: "static"  # Not animated, but included for reference
    text: "&fOnline: &a{online_players}"
