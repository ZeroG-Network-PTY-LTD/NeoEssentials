# ========================================================
# NeoEssentials Tablist Configuration
# ========================================================
# This file contains all tablist templates, headers, footers,
# boss bars, and group-specific configurations for the
# enhanced TAB-like tablist system.
# ========================================================

# General tablist settings
settings:
  update_interval: 1000  # Update interval in milliseconds
  enable_animations: true
  enable_headers: true
  enable_footers: true
  enable_bossbars: true
  enable_group_specific: true
  
  # Animation intervals in ticks (1 tick = 50ms)
  header_animation_interval: 20  # 1 second between header frames
  footer_animation_interval: 20  # 1 second between footer frames

# Default templates for all players
templates:
  headers:
    - "&6&l✦ &b&lNeoEssentials Server &6&l✦"
    - "&eWelcome, &#FF5722%player%&e!"
    - "&eOnline: &#4CAF50%online%&e/&#2196F3%max%"
    - "&#FF0000T&#FF4000e&#FF8000s&#FFC000t&#FFFF00i&#80FF00n&#40FF00g &#00FF00H&#0080FFe&#0000FFx"
  
  footers:
    - "&eBalance: &#FFD700%balance% &ecoins"
    - "&#9C27B0www.example.com"
    - "&#FF6B35Thanks for playing!"
    - "&eServer TPS: &#4CAF50%tps% &7| &eMemory: &#FF9800%memory_percent%"

# Group-specific templates
groups:
  admin:
    headers:
      - "&4&l★ &c&lAdmin Panel &4&l★"
      - "&cServer TPS: &f%tps% &7| &cMemory: &f%memory_percent%"
      - "&cOnline players: &f%online%/%max%"
    footers:
      - "&cAdmin Command Help: &f/neoessentials help"
      - "&cServer uptime: &f%uptime%"
      - "&cMemory usage: &f%memory_used%&c/&f%memory_max% MB"
  
  vip:
    headers:
      - "&6&l⚜ &e&lVIP Perks Active &6&l⚜"
      - "&eWelcome back, &6%player%&e!"
      - "&eThank you for supporting our server!"
    footers:
      - "&6VIP Balance: &e%balance% coins"
      - "&6Use &e/vip help &6for a list of perks"
      - "&6Website: &ewww.example.com/vip"
  
  mod:
    headers:
      - "&b&l✦ &3&lModerator Tools &b&l✦"
      - "&3Server TPS: &f%tps% &7| &3Memory: &f%memory_percent%"
      - "&3Online players: &f%online%/%max%"
    footers:
      - "&3Mod Commands: &f/neoessentials mod"
      - "&3Server uptime: &f%uptime%"
      - "&3Memory usage: &f%memory_used%&3/&f%memory_max% MB"

# Boss bar configurations
bossbars:
  global:
    - "{color:red}{style:progress}{progress:1.0}Server TPS: %tps%"
    - "{color:green}{style:notched_6}{progress:0.8}Welcome to the server!"
    - "{color:blue}{style:progress}{progress:%memory_percent/100%}Memory: %memory_percent%% (%memory_used%/%memory_max% MB)"
  
  groups:
    admin:
      - "{color:purple}{style:progress}{progress:1.0}Admin Mode Active"
      - "{color:red}{style:notched_10}{progress:1.0}Server control panel"
    
    vip:
      - "{color:gold}{style:progress}{progress:1.0}VIP Status Active"
      - "{color:yellow}{style:notched_6}{progress:1.0}Thank you for supporting us!"

# Metadata
metadata:
  schema_version: "1.0"
  description: "NeoEssentials Tablist Templates"
  format: "YAML"
  last_updated: "2025-06-27"
