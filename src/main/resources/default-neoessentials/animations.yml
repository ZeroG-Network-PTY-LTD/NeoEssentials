# ========================================================
# NeoEssentials Tablist Animations
# ========================================================
# This file contains all animation configurations for
# headers, footers, and other tablist elements.
# ========================================================

# Metadata
metadata:
  version: "1.0.0"
  description: "NeoEssentials Tablist Animations"
  format: "YAML"
  created: "2025-06-27"

# Animation definitions
animations:
  default:
    change_interval: 50  # Ticks between animation frames
    texts:
      - "&#54C5EAE&#54DAF4x&#54C5EAa&#54B1DFm&#549CD5p&#5487CBl&#5473C0e"
      - "&#54B1DFE&#54C5EAx&#54DAF4a&#54C5EAm&#54B1DFp&#549CD5l&#5487CBe"
      - "&#549CD5E&#54B1DFx&#54C5EAa&#54DAF4m&#54C5EAp&#54B1DFl&#549CD5e"
      - "&#5487CBE&#549CD5x&#54B1DFa&#54C5EAm&#54DAF4p&#54C5EAl&#54B1DFe"
      - "&#5473C0E&#5487CBx&#549CD5a&#54B1DFm&#54C5EAp&#54DAF4l&#54C5EAe"

  rainbow:
    change_interval: 30
    texts:
      - "&#FF0000R&#FF7F00a&#FFFF00i&#00FF00n&#0000FFb&#4B0082o&#9400D3w"
      - "&#FF7F00R&#FFFF00a&#00FF00i&#0000FFn&#4B0082b&#9400D3o&#FF0000w"
      - "&#FFFF00R&#00FF00a&#0000FFi&#4B0082n&#9400D3b&#FF0000o&#FF7F00w"

  welcome:
    change_interval: 40
    texts:
      - "&cW&felcome!"
      - "&cWe&flcome!"
      - "&cWel&fcome!"
      - "&cWelc&fome!"
      - "&cWelco&fme!"
      - "&cWelcom&fe!"
      - "&cWelcome&f!"
      - "&fW&celcome!"
      - "&fWe&clcome!"
      - "&fWel&ccome!"
      - "&fWelc&come!"
      - "&fWelco&cme!"
      - "&fWelcom&ce!"

  server_name:
    change_interval: 80
    texts:
      - "&c&lNeoEssentials"
      - "&c&l&nNeoEssentials"
      - "&b&lNeoEssentials"
      - "&b&l&nNeoEssentials"
      - "&a&lNeoEssentials"
      - "&a&l&nNeoEssentials"
      - "&e&lNeoEssentials"
      - "&e&l&nNeoEssentials"

  loading:
    change_interval: 20
    texts:
      - "&eLoading"
      - "&eLoading."
      - "&eLoading.."
      - "&eLoading..."
      - "&eLoading...."
      - "&eLoading....."

  clock:
    change_interval: 100
    texts:
      - "&f🕐 &7%time%"
      - "&f🕑 &7%time%"
      - "&f🕒 &7%time%"
      - "&f🕓 &7%time%"
      - "&f🕔 &7%time%"
      - "&f🕕 &7%time%"
      - "&f🕖 &7%time%"
      - "&f🕗 &7%time%"
      - "&f🕘 &7%time%"
      - "&f🕙 &7%time%"
      - "&f🕚 &7%time%"
      - "&f🕛 &7%time%"

  wave:
    change_interval: 25
    texts:
      - "&b~&3~&b~&3~&b~&3~&b~"
      - "&3~&b~&3~&b~&3~&b~&3~"
      - "&b~&3~&b~&3~&b~&3~&b~"
      - "&3~&b~&3~&b~&3~&b~&3~"

  pulse:
    change_interval: 15
    texts:
      - "&8●&7○&8○"
      - "&7●&f○&7○"
      - "&f●&7○&8○"
      - "&7●&8○&7○"

  scroll:
    change_interval: 10
    texts:
      - "&6>>> &eWelcome to NeoEssentials! &6<<<"
      - "&6>> &eWelcome to NeoEssentials! &6<<&6<"
      - "&6> &eWelcome to NeoEssentials! &6<&6<&6<"
      - "&eWelcome to NeoEssentials! &6<&6<&6<&6>"
      - "&eWelcome to NeoEssentials! &6<&6<&6>&6>"
      - "&eWelcome to NeoEssentials! &6<&6>&6>>"
      - "&eWelcome to NeoEssentials! &6>&6>>>"

  typing:
    change_interval: 5
    texts:
      - "&7|"
      - "&f|"
      - "&7|"
      - "&f|"
      - "&7|"
      - "&f|"
      - "&7"
      - "&f"

# Animation usage examples for templates
# You can use animations in your tablist.yml like this:
# headers:
#   - "{animation:rainbow}"
#   - "Welcome {animation:typing}"
#   - "{animation:server_name} Server"
