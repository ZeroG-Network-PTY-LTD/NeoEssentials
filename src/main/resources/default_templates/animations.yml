# NeoEssentials Animations Configuration
# This file contains definitions for tablist animations

# Default RGB gradient animation
gradient_animation:
  type: "gradient"
  frames_per_second: 10
  colors:
    - "#FF5F6D"
    - "#FFC371"
    - "#FF5F6D"
  text: "Welcome to the server!"

# Rainbow animation
rainbow_animation:
  type: "rainbow"
  frames_per_second: 20
  speed: 0.5
  text: "Rainbow Text Animation"

# Blink animation
blink_animation:
  type: "blink"
  frames_per_second: 2
  colors:
    - "#FF0000"
    - "#0000FF"
  text: "Blinking Text"

# Wave animation
wave_animation:
  type: "wave"
  frames_per_second: 10
  amplitude: 0.5
  frequency: 0.2
  text: "Waving Text Animation"

# Type animation
typing_animation:
  type: "typing"
  frames_per_second: 5
  text: "This text appears letter by letter"
  
# Cycle animation
cycle_animation:
  type: "cycle"
  frames_per_second: 1
  frames:
    - "Frame 1"
    - "Frame 2"
    - "Frame 3"
    
# Fade animation
fade_animation:
  type: "fade"
  frames_per_second: 10
  start_color: "#FF0000"
  end_color: "#0000FF"
  text: "Color fading animation"
