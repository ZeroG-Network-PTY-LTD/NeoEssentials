plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.93'
    id 'idea'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = project.mod_version
group = project.mod_group_id

repositories {
    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.org"
    }
    mavenCentral()
}

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version
    
    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }
    
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
    
    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.43.0.0'
    
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

// Shadow jar configuration for SQLite
shadowJar {
    archiveClassifier = 'shadow'
    configurations = [project.configurations.runtimeClasspath]
    
    // Relocate SQLite to avoid conflicts with other mods like GriefLogger
    relocate 'org.sqlite', 'com.zerog.neoessentials.relocated.sqlite'
    
    // Exclude unnecessary files
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

// Build number increment task
def buildNumberFile = file('build_number.txt')

task incrementBuildNumber {
    doLast {
        def buildNumber = 1
        if (buildNumberFile.exists()) {
            buildNumber = buildNumberFile.text.trim().toInteger() + 1
        }
        buildNumberFile.text = buildNumber.toString()
        println "Build number incremented to: ${buildNumber}"
    }
}

// Make jar task depend on incrementBuildNumber
jar.dependsOn incrementBuildNumber

// Configure jar task
jar {
    doFirst {
        def buildNumber = buildNumberFile.exists() ? buildNumberFile.text.trim() : "1"
        archiveVersion = "${project.mod_version}.${buildNumber}"
        
        manifest {
            attributes([
                'Specification-Title': project.mod_id,
                'Specification-Vendor': project.mod_group_id,
                'Specification-Version': project.mod_version,
                'Implementation-Title': project.name,
                'Implementation-Version': archiveVersion,
                'Implementation-Vendor': project.mod_group_id,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Built-By': System.getProperty('user.name'),
                'Build-Jdk': System.getProperty('java.version'),
                'Created-By': "Gradle ${gradle.gradleVersion}"
            ])
        }
    }
    
    from(sourceSets.main.output)
    from(configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
