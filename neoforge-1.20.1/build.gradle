plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.5.1'
    id 'idea'
}

archivesBaseName = 'neoessentials-neoforge-1.20.1'

// Get the build number from the root project
def getBuildNumber() {
    def propsFile = rootProject.file("buildnumber.properties")
    if (!propsFile.exists()) {
        propsFile.text = "buildNumber=1"
        return 1
    }
    
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    return props.getProperty("buildNumber").toInteger()
}

def buildNumber = getBuildNumber()
version = "${version}.${buildNumber}"

java {
    withSourcesJar()
    withJavadocJar()
    toolchain.languageVersion = JavaLanguageVersion.of(17) // Use Java 17 for MC 1.20.1
}

// Create a task extension to hold version properties
abstract class VersionPropertiesExtension {
    abstract Property<String> getModVersion()
    abstract Property<String> getLoaderVersionRange()
    abstract Property<String> getNeoVersionRange()
    abstract Property<String> getMinecraftVersionRange()
}

// Add the extension to the project
def versionProps = extensions.create('versionProps', VersionPropertiesExtension)
versionProps.modVersion.set(version)
versionProps.loaderVersionRange.set("[1,)")
versionProps.neoVersionRange.set("[20.2,20.3)")
versionProps.minecraftVersionRange.set("[1.20.1]")

// NeoForge specific configuration
neoForge {
    version = "47.1.96" // For MC 1.20.1

    mappings {
        parchment() {
            version = "2023.09.03-1.20.1"
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'neoessentials'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'neoessentials'
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'neoessentials'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "neoessentials" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Configure processResources to replace version in mods.toml
tasks.processResources.configure {
    inputs.property("version", versionProps.modVersion)
    inputs.property("loader_version_range", versionProps.loaderVersionRange)
    inputs.property("neo_version_range", versionProps.neoVersionRange)
    inputs.property("minecraft_version_range", versionProps.minecraftVersionRange)
    
    filesMatching("META-INF/mods.toml") {
        expand(
            "version": versionProps.modVersion.get(),
            "loader_version_range": versionProps.loaderVersionRange.get(),
            "neo_version_range": versionProps.neoVersionRange.get(),
            "minecraft_version_range": versionProps.minecraftVersionRange.get()
        )
    }
}

// Dependencies
dependencies {
    // Add dependency on common module
    implementation project(':common')
}

// Create source tree template for 1.20.1 module
tasks.register('createSourceTemplate') {
    description = 'Create source directories and template files for this module'
    
    doLast {
        def javaDir = file("src/main/java/com/zerog/neoessentials")
        def resourcesDir = file("src/main/resources/META-INF")
        
        javaDir.mkdirs()
        resourcesDir.mkdirs()
        
        // Create template main class
        def mainClass = new File(javaDir, "NeoEssentials.java")
        mainClass.text = """package com.zerog.neoessentials;

import org.slf4j.Logger;
import com.mojang.logging.LogUtils;
import net.neoforged.fml.common.Mod;
import net.neoforged.neoforge.common.NeoForge;

@Mod(NeoEssentials.MODID)
public class NeoEssentials {
    public static final String MODID = "neoessentials";
    public static final String MOD_NAME = "NeoEssentials";
    public static final Logger LOGGER = LogUtils.getLogger();
    
    private static NeoEssentials instance;
    
    public NeoEssentials() {
        instance = this;
        
        LOGGER.info("NeoEssentials initializing for Minecraft 1.20.1");
        
        // Register with event bus
        NeoForge.EVENT_BUS.register(this);
        
        // Initialize mod
        // TODO: Copy and adapt core initialization from 1.21.1 version
    }
    
    public static NeoEssentials getInstance() {
        return instance;
    }
}
"""
        
        // Create template mods.toml
        def modsToml = new File(resourcesDir, "mods.toml")
        modsToml.text = """modLoader="javafml"
loaderVersion="\${loader_version_range}"
license="MIT"
issueTrackerURL="https://github.com/zerog/neoessentials/issues"

[[mods]]
modId="neoessentials"
version="\${version}"
displayName="NeoEssentials (Server-Side)"
credits="Inspired by EssentialsX for Bukkit/Spigot servers"
authors="ZeroG"
description='''
NeoEssentials adds essential server commands and features to NeoForge Minecraft servers.
Inspired by EssentialsX for Bukkit/Spigot servers.
'''

[[dependencies.neoessentials]]
    modId="neoforge"
    mandatory=true
    versionRange="\${neo_version_range}"
    ordering="NONE"
    side="SERVER"

[[dependencies.neoessentials]]
    modId="minecraft"
    mandatory=true
    versionRange="\${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
"""
        
        println "Created template source structure for NeoForge 1.20.1 module"
    }
}
