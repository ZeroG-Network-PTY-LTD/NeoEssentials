plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.+'
}

archivesBaseName = 'neoessentials-forge-1.19.4'

// Get the build number from the root project
def getBuildNumber() {
    def propsFile = rootProject.file("buildnumber.properties")
    if (!propsFile.exists()) {
        propsFile.text = "buildNumber=1"
        return 1
    }
    
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    return props.getProperty("buildNumber").toInteger()
}

def buildNumber = getBuildNumber()
version = "${version}.${buildNumber}"

java {
    archivesBaseName = 'neoessentials-forge-1.19.4'
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // Snapshot: YYYYMMDD-x.x.x    Snapshot are built nightly.
    // Official: x.x.x             Official builds at a specific version.
    // Select a mapping from the list of available mappings.
    // Recommendation: Use the latest available mapping.
    mappings channel: 'official', version: '1.19.4'

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg') // Currently, this location cannot be changed from the default.

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', 'neoessentials'

            mods {
                neoessentials {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            property 'forge.enabledGameTestNamespaces', 'neoessentials'

            mods {
                neoessentials {
                    source sourceSets.main
                }
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            property 'forge.enabledGameTestNamespaces', 'neoessentials'

            mods {
                neoessentials {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', 'neoessentials', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                neoessentials {
                    source sourceSets.main
                }
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        // Location of the maven that hosts JEI files (and Forge stuff)
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
}

// Dependencies
dependencies {
    // Add dependency on common module
    implementation project(':common')

    // Specify the version of Minecraft to use. If this is any group other than 'net.minecraft', it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency, and its patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft 'net.minecraftforge:forge:1.19.4-45.2.0'
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "neoessentials",
                "Specification-Vendor"    : "zerognetwork",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "zerognetwork",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Create source tree template for Forge 1.19.4 module
tasks.register('createSourceTemplate') {
    description = 'Create source directories and template files for this module'
    
    doLast {
        def javaDir = file("src/main/java/com/zerog/neoessentials")
        def resourcesDir = file("src/main/resources/META-INF")
        
        javaDir.mkdirs()
        resourcesDir.mkdirs()
        
        // Create template main class
        def mainClass = new File(javaDir, "NeoEssentials.java")
        mainClass.text = """package com.zerog.neoessentials;

import org.slf4j.Logger;
import com.mojang.logging.LogUtils;
import net.minecraftforge.common.MinecraftForge;
import net.minecraftforge.fml.common.Mod;

@Mod(NeoEssentials.MODID)
public class NeoEssentials {
    public static final String MODID = "neoessentials";
    public static final String MOD_NAME = "NeoEssentials";
    public static final Logger LOGGER = LogUtils.getLogger();
    
    private static NeoEssentials instance;
    
    public NeoEssentials() {
        instance = this;
        
        LOGGER.info("NeoEssentials initializing for Minecraft 1.19.4 (Forge)");
        
        // Register with event bus
        MinecraftForge.EVENT_BUS.register(this);
        
        // Initialize mod
        // TODO: Copy and adapt core initialization from NeoForge version
    }
    
    public static NeoEssentials getInstance() {
        return instance;
    }
}
"""
        
        // Create template mods.toml
        def modsToml = new File(resourcesDir, "mods.toml")
        modsToml.text = """modLoader="javafml"
loaderVersion="[45,)"
license="MIT"
issueTrackerURL="https://github.com/zerog/neoessentials/issues"

[[mods]]
modId="neoessentials"
version="${version}"
displayName="NeoEssentials (Server-Side)"
credits="Inspired by EssentialsX for Bukkit/Spigot servers"
authors="ZeroG"
description='''
NeoEssentials adds essential server commands and features to Forge Minecraft servers.
Inspired by EssentialsX for Bukkit/Spigot servers.
'''

[[dependencies.neoessentials]]
    modId="forge"
    mandatory=true
    versionRange="[45,)"
    ordering="NONE"
    side="SERVER"

[[dependencies.neoessentials]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.19.4]"
    ordering="NONE"
    side="BOTH"
"""
        
        // Create pack.mcmeta
        def packMcmeta = new File(file("src/main/resources"), "pack.mcmeta")
        packMcmeta.getParentFile().mkdirs()
        packMcmeta.text = """{
    "pack": {
        "description": "NeoEssentials resources",
        "pack_format": 12
    }
}
"""
        
        println "Created template source structure for Forge 1.19.4 module"
    }
}
