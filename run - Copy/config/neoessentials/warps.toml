#Warp System Settings
[warps]
	#Cooldown between warp teleportations (in seconds)
	# Default: 30
	# Range: > 0
	cooldownSeconds = 30
	#Warmup delay before teleportation (in seconds)
	# Default: 3
	# Range: > 0
	warmupSeconds = 3
	#Cancel teleportation if player moves during warmup
	cancelOnMove = true
	#Cancel teleportation if player takes damage during warmup
	cancelOnDamage = true
	#Whether /warps list shows private warps to regular users
	listShowsPrivate = false
	#Allow players to create their own warps
	allowPlayerWarps = true
	#Default maximum number of warps per player
	# Default: 2
	# Range: 0 ~ 1000
	defaultMaxPlayerWarps = 2

#Permission Settings
[permissions]
	#Permission prefix for warp commands
	permissionPrefix = "neoessentials.warp"
	#Use permission-based warp limits (neoessentials.warp.max.#)
	useMaxWarpsPermission = true
