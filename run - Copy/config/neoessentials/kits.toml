#Kit System Settings
[kits]
	#Use separate cooldowns for each kit (if false, claiming any kit puts all on cooldown)
	useSeparateCooldowns = true
	#Notify players when a kit becomes available again
	notifyOnAvailable = false
	#Show unavailable kits in the kit list command
	showUnavailableKits = true
	#Default kit to give to new players (leave empty for none)
	defaultKit = "starter"
	#Whether to drop kit items on the ground if inventory is full
	overrideFullInventory = true

#Permission Settings
[permissions]
	#Permission prefix for kit commands
	permissionPrefix = "neoessentials.kit"
