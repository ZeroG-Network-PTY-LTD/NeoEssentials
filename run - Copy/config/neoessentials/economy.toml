#Economy Settings
[economy]
	#The name of the currency (singular form)
	currencyNameSingular = "coin"
	#The name of the currency (plural form)
	currencyNamePlural = "coins"
	#The symbol used when displaying currency amounts
	currencySymbol = "$"
	#Starting balance for new players
	# Default: 100.0
	# Range: 0.0 ~ 1.7976931348623157E308
	startingBalance = 100.0
	#Enable interest payments on player balances
	enableInterest = false
	#Interest rate percentage (only used if interest is enabled)
	# Default: 0.5
	# Range: 0.0 ~ 100.0
	interestRate = 0.5
	#How often to apply interest (in minutes)
	# Default: 60
	# Range: > 1
	interestInterval = 60
	#Maximum number of entries to show in the baltop command
	# Default: 10
	# Range: 1 ~ 100
	maxBaltopEntries = 10

#Transaction Settings
[transactions]
	#Whether to log all economy transactions
	logTransactions = true
	#Whether to notify players when they receive money
	notifyOnPay = true
	#Whether to allow players to have a negative balance
	allowNegativeBalance = false
