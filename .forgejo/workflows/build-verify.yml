name: Build Verify

# Compiles the mod jar on the self-hosted Forgejo mirror and uploads it as a
# downloadable Actions artifact. This exists as a stand-in for GitHub Actions
# CI, which is currently blocked repo-wide by an org Actions policy — see
# NeoEssentials' project memory for that issue. It only verifies the build
# and stores a jar; it does not create releases, touch GitHub in any way, or
# post to Discord — those stay owned by .github/workflows/build-and-release.yml
# on GitHub. The JDK image below only launches Gradle; the correct per-branch
# JDK (21 for 1.21.x/26.1.x's MC versions, 25 for 26.2.x) is auto-provisioned
# by Gradle's own toolchain resolver, same as the GitHub workflow.

on:
  push:
    branches:
      - 1.21.x
      - 26.1.x
      - 26.2.x
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    # NOT a JDK image — the runner here executes Actions via Node.js (actions/checkout,
    # actions/upload-artifact are JS actions run with `node dist/index.js` directly), so the
    # container needs node + git, not a JDK. eclipse-temurin:21-jdk has neither, which made
    # even the checkout step fail with "node: executable file not found in $PATH" before the
    # build ever ran. catthehacker/ubuntu:act-* is the standard image for self-hosted
    # Forgejo/Gitea Actions runners for exactly this reason. Gradle's own toolchain resolver
    # (see build.gradle) downloads whatever JDK each branch actually needs regardless of what
    # the container image ships, so no JDK needs to be preinstalled here at all.
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build jar
        run: ./gradlew build -x test --console=plain

      - name: Locate built jar
        id: jar
        run: |
          jar_path=$(ls -t build/libs/*.jar | head -n 1)
          echo "path=${jar_path}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${jar_path}")" >> "$GITHUB_OUTPUT"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.path }}
