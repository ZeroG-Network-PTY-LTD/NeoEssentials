name: Build Verify

# Compiles the mod jar on the self-hosted Forgejo mirror and uploads it as a
# downloadable Actions artifact. This exists as a stand-in for GitHub Actions
# CI, which is currently blocked repo-wide by an org Actions policy — see
# NeoEssentials' project memory for that issue. It only verifies the build
# and stores a jar; it does not create releases, touch GitHub in any way, or
# post to Discord — those stay owned by .github/workflows/build-and-release.yml
# on GitHub. The "Set up JDK" step below only launches the Gradle wrapper itself
# (which needs SOME java on PATH just to bootstrap — confirmed live: without it,
# gradlew fails immediately with "JAVA_HOME is not set and no 'java' command
# could be found"); the correct per-branch JDK actually used to COMPILE (21 for
# 1.21.x/26.1.x's MC versions, 25 for 26.2.x) is auto-provisioned separately by
# Gradle's own toolchain resolver, same as the GitHub workflow. Installed via apt
# rather than actions/setup-java@v4 — this Forgejo instance's action mirror
# (code.forgejo.org) only carries a curated subset of GitHub's actions and
# doesn't have setup-java (confirmed: 404), and pointing at the real
# github.com/actions/setup-java instead would add an external dependency this
# internal verify workflow doesn't need.

on:
  push:
    branches:
      - 1.21.x
      - 26.1.x
      - 26.2.x
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    # NOT a JDK-only image — the runner here executes Actions via Node.js (actions/checkout,
    # actions/upload-artifact are JS actions run with `node dist/index.js` directly), so the
    # container needs node + git too, not just a JDK. eclipse-temurin:21-jdk has neither,
    # which made even the checkout step fail with "node: executable file not found in $PATH"
    # before the build ever ran. catthehacker/ubuntu:act-* is the standard image for
    # self-hosted Forgejo/Gitea Actions runners for exactly this reason — it still needs a
    # JDK added explicitly below for gradlew itself to run at all.
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        run: |
          apt-get update -qq
          apt-get install -y -qq openjdk-21-jdk-headless
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build jar
        run: ./gradlew build -x test --console=plain

      - name: Locate built jar
        id: jar
        run: |
          jar_path=$(ls -t build/libs/*.jar | head -n 1)
          echo "path=${jar_path}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${jar_path}")" >> "$GITHUB_OUTPUT"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.path }}
