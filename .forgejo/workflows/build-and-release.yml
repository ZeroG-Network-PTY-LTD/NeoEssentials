name: Build & Release Jar (Forgejo)

# Forgejo Actions stand-in for GitHub's own .github/workflows/build-and-release.yml, while
# that one is blocked repo-wide by an org Actions policy (see NeoEssentials' project memory
# for that issue). Same shape: one shared GitHub-style release PER BUILD NUMBER, with all
# three branches' jars attached as separate assets on that same release rather than one
# release each — whichever branch runs first creates it, the others just add their jar.
#
# Build numbering is tracked independently HERE, via this repo's own "BUILD_NUMBER" Forgejo
# Actions variable — Forgejo has no way to reach GitHub's own Actions variable, so this one
# was seeded to 70 (GitHub's NEXT number, not its last-used 69 — Forgejo has never actually
# published anything, so seeding it to 69 would make the "reuse if not already used" check
# below reuse 69 forever, since Forgejo itself never marks 69 as used) the day this workflow
# was added, specifically so numbers don't collide once GitHub's CI is unblocked again. If
# GitHub CI and this one both publish for a while, keep them in sync by hand (or just let this
# workflow fall out of use again once GitHub is fixed).
#
# Requires a repo secret CI_RELEASE_TOKEN — a Forgejo access token with read/write access to
# this repo (Actions variables + repo contents/releases) — add it manually via this repo's
# Settings > Actions > Secrets. Forgejo's own built-in Actions token isn't used for this, for
# the same reason GitHub's workflow uses a dedicated CI_BUILD_NUMBER_PAT instead of the
# default GITHUB_TOKEN: the default token doesn't reliably have variable-write permission.

on:
  push:
    branches:
      - 1.21.x
      - 26.1.x
      - 26.2.x
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: docker
    # NOT a JDK-only image — the runner here executes Actions via Node.js (actions/checkout,
    # actions/upload-artifact are JS actions run with `node dist/index.js` directly), so the
    # container needs node + git too, not just a JDK. eclipse-temurin:21-jdk has neither,
    # which made even the checkout step fail with "node: executable file not found in $PATH"
    # before the build ever ran. catthehacker/ubuntu:act-* is the standard image for
    # self-hosted Forgejo/Gitea Actions runners for exactly this reason — it still needs a
    # JDK added explicitly below for gradlew itself to run at all.
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails in seconds instead of discovering a bad/missing secret only after a ~20min
      # build, at the Bump/Publish steps' own API calls (confirmed live: those steps treat a
      # failed auth check as "no data" and silently continue instead of stopping, wasting a
      # full build cycle before the real error surfaces).
      - name: Verify CI_RELEASE_TOKEN
        env:
          FORGEJO_API: ${{ github.server_url }}/api/v1
          TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "TOKEN length: ${#TOKEN} (expect 40 for a Forgejo access token; 0 means the secret isn't reaching this job)"
          code=$(curl -s -o /tmp/whoami.json -w "%{http_code}" -H "Authorization: token $TOKEN" \
            "$FORGEJO_API/repos/$REPO/actions/variables/BUILD_NUMBER")
          echo "Auth check -> HTTP $code"; cat /tmp/whoami.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::CI_RELEASE_TOKEN failed to authenticate (HTTP $code) - check the secret's value in Settings > Actions > Secrets"
            exit 1
          fi

      - name: Set up JDK
        # Only launches the Gradle wrapper itself (confirmed live: without ANY java on PATH,
        # gradlew fails immediately with "JAVA_HOME is not set and no 'java' command could be
        # found"); the actual per-branch compile JDK (21 for 1.21.x/26.1.x, 25 for 26.2.x) is
        # auto-provisioned separately by Gradle's own toolchain resolver, same as GitHub's
        # workflow. Installed via apt rather than actions/setup-java@v4 — this instance's
        # action mirror (code.forgejo.org) doesn't carry setup-java (confirmed 404).
        run: |
          apt-get update -qq
          apt-get install -y -qq openjdk-21-jdk-headless
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read mod version
        id: mod_version
        run: echo "value=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      # Same "reuse if this branch hasn't published under the current number yet, otherwise
      # bump" logic as the GitHub workflow's own "Bump shared build number" step — see that
      # step's comments for the full rationale. Adapted here to Forgejo's REST API instead of
      # `gh`/GitHub's Variables API, using node (already present in the container image, since
      # actions/checkout needs it too) to parse JSON rather than assuming jq is installed.
      - name: Bump shared build number
        id: build_number
        env:
          FORGEJO_API: ${{ github.server_url }}/api/v1
          TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          MOD_VERSION: ${{ steps.mod_version.outputs.value }}
          MARKER: ${{ github.ref_name }}
        run: |
          set -e
          echo "TOKEN length: ${#TOKEN} (expect 40 for a Forgejo access token; 0 means the secret isn't reaching this job)"

          var_code=$(curl -s -o /tmp/var.json -w "%{http_code}" -H "Authorization: token $TOKEN" \
            "$FORGEJO_API/repos/$REPO/actions/variables/BUILD_NUMBER")
          echo "GET BUILD_NUMBER -> HTTP $var_code"; cat /tmp/var.json; echo
          if [ "$var_code" = "200" ]; then
            # Forgejo's variable API returns the value under "data", not "value" like GitHub's
            # equivalent (confirmed live: {"owner_id":0,"repo_id":2,"name":"BUILD_NUMBER","data":"70"})
            # - reading .value here silently produced the string "undefined", which then broke
            # Gradle's own toInteger() parse of build_number.txt with a config-evaluation crash.
            current=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/var.json','utf8')).data)")
          else
            current=0
          fi

          rel_code=$(curl -s -o /tmp/rel.json -w "%{http_code}" -H "Authorization: token $TOKEN" \
            "$FORGEJO_API/repos/$REPO/releases/tags/${MOD_VERSION}-build-${current}")
          if [ "$rel_code" = "200" ]; then
            has_marker=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/rel.json','utf8'));console.log((j.assets||[]).some(a=>a.name.includes(process.env.MARKER))?'yes':'no')")
          else
            has_marker=no
          fi
          echo "current=$current has_marker=$has_marker"

          if [ "$has_marker" = "yes" ]; then
            next=$((current + 1))
            put_code=$(curl -s -o /tmp/put.json -w "%{http_code}" -X PUT -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"value\":\"$next\"}" \
              "$FORGEJO_API/repos/$REPO/actions/variables/BUILD_NUMBER")
            echo "PUT BUILD_NUMBER -> HTTP $put_code"; cat /tmp/put.json; echo
            if [ "$put_code" != "200" ] && [ "$put_code" != "204" ]; then
              echo "::error::Failed to bump BUILD_NUMBER (HTTP $put_code)"
              exit 1
            fi
          else
            next=$current
          fi

          echo "$next" > build_number.txt
          echo "value=$next" >> "$GITHUB_OUTPUT"

      - name: Build jar
        run: ./gradlew build -x test --console=plain

      - name: Locate built jar
        id: jar
        run: |
          jar_path=$(ls -t build/libs/*.jar | head -n 1)
          echo "path=${jar_path}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${jar_path}")" >> "$GITHUB_OUTPUT"

      # One release per build number, shared by all three branches — mirrors the GitHub
      # workflow's own softprops/action-gh-release step, done here via Forgejo's REST API
      # directly since that action is GitHub-specific.
      - name: Publish build release
        env:
          FORGEJO_API: ${{ github.server_url }}/api/v1
          TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.mod_version.outputs.value }}-build-${{ steps.build_number.outputs.value }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
          JAR_NAME: ${{ steps.jar.outputs.name }}
        run: |
          set -e

          existing_code=$(curl -s -o /tmp/existing.json -w "%{http_code}" -H "Authorization: token $TOKEN" \
            "$FORGEJO_API/repos/$REPO/releases/tags/$TAG")
          echo "GET release tag $TAG -> HTTP $existing_code"; cat /tmp/existing.json; echo

          if [ "$existing_code" = "200" ]; then
            release_id=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/existing.json','utf8')).id)")
          else
            create_code=$(curl -s -o /tmp/created.json -w "%{http_code}" -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"\`$BRANCH\`: commit $SHA.\",\"target_commitish\":\"$SHA\",\"prerelease\":true}" \
              "$FORGEJO_API/repos/$REPO/releases")
            echo "POST create release -> HTTP $create_code"; cat /tmp/created.json; echo
            if [ "$create_code" != "201" ]; then
              echo "::error::Failed to create release (HTTP $create_code)"
              exit 1
            fi
            release_id=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/created.json','utf8')).id)")
          fi
          echo "release_id=$release_id"

          # The jar filename contains a literal "+" (e.g. "...+build.70-all.jar") - confirmed
          # live that an un-encoded "+" in the ?name= query param gets interpreted as a space
          # by Forgejo, landing the asset as "...  build.70-all.jar" instead. encodeURIComponent
          # it properly rather than interpolating the raw name into the URL.
          jar_name_encoded=$(node -e "console.log(encodeURIComponent(process.env.JAR_NAME))")
          asset_code=$(curl -s -o /tmp/asset.json -w "%{http_code}" -X POST -H "Authorization: token $TOKEN" \
            -F "attachment=@${JAR_PATH};filename=${JAR_NAME}" \
            "$FORGEJO_API/repos/$REPO/releases/$release_id/assets?name=${jar_name_encoded}")
          echo "POST upload asset -> HTTP $asset_code"; cat /tmp/asset.json; echo
          if [ "$asset_code" != "201" ]; then
            echo "::error::Failed to upload release asset (HTTP $asset_code)"
            exit 1
          fi
