name: Build & Release Jar (Forgejo)

# Forgejo Actions stand-in for GitHub's own .github/workflows/build-and-release.yml, while
# that one is blocked repo-wide by an org Actions policy (see NeoEssentials' project memory
# for that issue). Same shape: one shared GitHub-style release PER BUILD NUMBER, with all
# three branches' jars attached as separate assets on that same release rather than one
# release each — one number per push (see "Bump shared build number" for how the three
# branches' cherry-picks of one change find each other).
#
# Build numbering is tracked independently HERE, via this repo's own "BUILD_NUMBER" Forgejo
# Actions variable — Forgejo has no way to reach GitHub's own Actions variable, so this one
# was seeded to 70 (GitHub's NEXT number, not its last-used 69 — Forgejo has never actually
# published anything, so seeding it to 69 would make the "reuse if not already used" check
# below reuse 69 forever, since Forgejo itself never marks 69 as used) the day this workflow
# was added, specifically so numbers don't collide once GitHub's CI is unblocked again. If
# GitHub CI and this one both publish for a while, keep them in sync by hand (or just let this
# workflow fall out of use again once GitHub is fixed).
#
# Requires a repo secret CI_RELEASE_TOKEN — a Forgejo access token with read/write access to
# this repo (Actions variables + repo contents/releases) — add it manually via this repo's
# Settings > Actions > Secrets. Forgejo's own built-in Actions token isn't used for this, for
# the same reason GitHub's workflow uses a dedicated CI_BUILD_NUMBER_PAT instead of the
# default GITHUB_TOKEN: the default token doesn't reliably have variable-write permission.

on:
  push:
    branches:
      - 1.21.x
      - 26.1.x
      - 26.2.x
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: docker
    # NOT a JDK-only image — the runner here executes Actions via Node.js (actions/checkout,
    # actions/upload-artifact are JS actions run with `node dist/index.js` directly), so the
    # container needs node + git too, not just a JDK. eclipse-temurin:21-jdk has neither,
    # which made even the checkout step fail with "node: executable file not found in $PATH"
    # before the build ever ran. catthehacker/ubuntu:act-* is the standard image for
    # self-hosted Forgejo/Gitea Actions runners for exactly this reason — it still needs a
    # JDK added explicitly below for gradlew itself to run at all.
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails in seconds instead of discovering a bad/missing secret only after a ~20min
      # build, at the Bump/Publish steps' own API calls (confirmed live: those steps treat a
      # failed auth check as "no data" and silently continue instead of stopping, wasting a
      # full build cycle before the real error surfaces).
      - name: Verify CI_RELEASE_TOKEN
        env:
          FORGEJO_API: ${{ github.server_url }}/api/v1
          TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "TOKEN length: ${#TOKEN} (expect 40 for a Forgejo access token; 0 means the secret isn't reaching this job)"
          code=$(curl -s -o /tmp/whoami.json -w "%{http_code}" -H "Authorization: token $TOKEN" \
            "$FORGEJO_API/repos/$REPO/actions/variables/BUILD_NUMBER")
          echo "Auth check -> HTTP $code"; cat /tmp/whoami.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::CI_RELEASE_TOKEN failed to authenticate (HTTP $code) - check the secret's value in Settings > Actions > Secrets"
            exit 1
          fi

      - name: Set up JDK
        # Only launches the Gradle wrapper itself (confirmed live: without ANY java on PATH,
        # gradlew fails immediately with "JAVA_HOME is not set and no 'java' command could be
        # found"); the actual per-branch compile JDK (21 for 1.21.x/26.1.x, 25 for 26.2.x) is
        # auto-provisioned separately by Gradle's own toolchain resolver, same as GitHub's
        # workflow. Installed via apt rather than actions/setup-java@v4 — this instance's
        # action mirror (code.forgejo.org) doesn't carry setup-java (confirmed 404).
        # Retried, then falls back to Adoptium's Temurin tarball: confirmed live (runs 48-50)
        # that a transient archive.ubuntu.com outage makes `apt-get update` "succeed" with stale
        # or no indexes, so the install then fails with "Unable to locate package" / "held
        # broken packages" — killing all three branches' builds at once. The timeout caps each
        # attempt; without it those runs sat ~8 minutes on connect timeouts before failing.
        run: |
          installed=no
          for attempt in 1 2 3; do
            if apt-get -o Acquire::http::Timeout=20 update -qq \
               && apt-get -o Acquire::http::Timeout=20 install -y -qq openjdk-21-jdk-headless; then
              installed=yes
              break
            fi
            echo "apt attempt $attempt failed, retrying in 15s"
            sleep 15
          done

          if [ "$installed" = "yes" ]; then
            echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> "$GITHUB_ENV"
          else
            echo "apt unavailable - falling back to Temurin 21 from Adoptium"
            mkdir -p /opt/jdk
            curl -fsSL --retry 5 --retry-delay 10 \
              "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse" \
              | tar -xz -C /opt/jdk --strip-components=1
            echo "JAVA_HOME=/opt/jdk" >> "$GITHUB_ENV"
            echo "/opt/jdk/bin" >> "$GITHUB_PATH"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read mod version
        id: mod_version
        run: echo "value=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      # One build number PER PUSH, shared by all three branches. The old "reuse the current
      # number unless this branch already has a jar on it" logic raced: each branch read the
      # counter whenever its (variable-length) JDK setup finished, so one push got split across
      # two numbers — confirmed live with runs 54-56, where 1.21.x landed on 78 but 26.1.x and
      # 26.2.x on 79.
      #
      # A push is identified by its "wave": a hash of the commit's author timestamp + subject.
      # Cherry-picks keep both (only the committer/SHA differ per branch), so all three
      # branches' copies of one change hash the same. The first branch to get here claims the
      # next number by creating that release up front, with the wave in its body; siblings find
      # it by wave and join it instead of bumping. Release creation doubles as the lock: if two
      # branches race to create the same tag, the loser re-reads it and joins when the wave
      # matches, or moves on to the next number when another push owns it.
      # A re-run of a commit whose jar is already on its wave's release claims a fresh number.
      # Uses node's built-in fetch (node is already in the image for actions/checkout) rather
      # than assuming jq is installed. Forgejo's variable API returns the value under "data",
      # not "value" like GitHub's (confirmed live: {"name":"BUILD_NUMBER","data":"70"}).
      - name: Bump shared build number
        id: build_number
        env:
          FORGEJO_API: ${{ github.server_url }}/api/v1
          TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          MOD_VERSION: ${{ steps.mod_version.outputs.value }}
          MARKER: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          echo "TOKEN length: ${#TOKEN} (expect 40 for a Forgejo access token; 0 means the secret isn't reaching this job)"
          export WAVE="$(git log -1 --format='%at %s' | sha1sum | cut -c1-12)"
          export SUBJECT="$(git log -1 --format='%s')"
          echo "wave=$WAVE ($SUBJECT)"

          next=$(node <<'JS'
          const api = process.env.FORGEJO_API + '/repos/' + process.env.REPO;
          const headers = { Authorization: 'token ' + process.env.TOKEN, 'Content-Type': 'application/json' };
          const prefix = process.env.MOD_VERSION + '-build-';
          const log = (...a) => console.error(...a);
          const hasWave = (rel, wave) => (rel.body || '').includes('wave: ' + wave);

          async function getJson(path) {
            const r = await fetch(api + path, { headers });
            log('GET ' + path + ' -> HTTP ' + r.status);
            return r.ok ? r.json() : null;
          }

          (async () => {
            let wave = process.env.WAVE;
            const recent = (await getJson('/releases?limit=30')) || [];
            const mine = recent.find(r => r.tag_name.startsWith(prefix) && hasWave(r, wave));
            if (mine) {
              if (!(mine.assets || []).some(a => a.name.includes(process.env.MARKER))) {
                log('Joining ' + mine.tag_name + ', already claimed for this push by another branch');
                console.log(mine.tag_name.slice(prefix.length));
                return;
              }
              log(mine.tag_name + ' already has a ' + process.env.MARKER + ' jar (re-run) - claiming a fresh number');
              wave += '-run' + process.env.RUN_ID;
            }

            const v = await getJson('/actions/variables/BUILD_NUMBER');
            let n = (parseInt(v && v.data, 10) || 0) + 1;
            for (let tries = 0; tries < 20; tries++, n++) {
              const tag = prefix + n;
              const created = await fetch(api + '/releases', {
                method: 'POST', headers,
                body: JSON.stringify({
                  tag_name: tag, name: tag, target_commitish: process.env.SHA, prerelease: true,
                  body: 'Build ' + n + ': ' + process.env.SUBJECT + '\n\nwave: ' + wave,
                }),
              });
              log('POST create release ' + tag + ' -> HTTP ' + created.status);
              if (created.status === 201) {
                log('Claimed ' + tag + ' for this push');
              } else {
                const existing = await getJson('/releases/tags/' + tag);
                if (!existing || !hasWave(existing, wave)) continue; // another push owns it
                log('Joining ' + tag + ', claimed for this push by another branch a moment ago');
              }
              const put = await fetch(api + '/actions/variables/BUILD_NUMBER', {
                method: 'PUT', headers, body: JSON.stringify({ value: String(n) }),
              });
              log('PUT BUILD_NUMBER=' + n + ' -> HTTP ' + put.status);
              console.log(n);
              return;
            }
            throw new Error('Could not claim a build number after 20 attempts');
          })().catch(e => { log(e); process.exit(1); });
          JS
          )

          echo "build number: $next"
          echo "$next" > build_number.txt
          echo "value=$next" >> "$GITHUB_OUTPUT"

      # Retried because createMinecraftArtifacts downloads the Minecraft client/server jars from
      # Mojang mid-build, and this runner's network drops out intermittently — confirmed live
      # (runs 51/52): "java.net.ConnectException: Network is unreachable" partway through those
      # downloads, while other downloads in the same run succeeded. A retry in the same job
      # reuses everything already downloaded, so it only re-fetches what failed.
      # JAVA_TOOL_OPTIONS (not GRADLE_OPTS) so it also reaches the separate JVM NeoForm's
      # runtime forks for those downloads: Mojang's hosts publish IPv6 addresses, and a Docker
      # container without an IPv6 route fails exactly this way if one gets picked.
      - name: Build jar
        env:
          JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
        run: |
          for attempt in 1 2 3; do
            if ./gradlew build -x test --console=plain; then
              exit 0
            fi
            echo "Build attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

      - name: Locate built jar
        id: jar
        run: |
          jar_path=$(ls -t build/libs/*.jar | head -n 1)
          echo "path=${jar_path}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${jar_path}")" >> "$GITHUB_OUTPUT"

      # One release per build number, shared by all three branches — mirrors the GitHub
      # workflow's own softprops/action-gh-release step, done here via Forgejo's REST API
      # directly since that action is GitHub-specific.
      - name: Publish build release
        env:
          FORGEJO_API: ${{ github.server_url }}/api/v1
          TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.mod_version.outputs.value }}-build-${{ steps.build_number.outputs.value }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
          JAR_NAME: ${{ steps.jar.outputs.name }}
        run: |
          set -e

          existing_code=$(curl -s -o /tmp/existing.json -w "%{http_code}" -H "Authorization: token $TOKEN" \
            "$FORGEJO_API/repos/$REPO/releases/tags/$TAG")
          echo "GET release tag $TAG -> HTTP $existing_code"; cat /tmp/existing.json; echo

          if [ "$existing_code" = "200" ]; then
            release_id=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/existing.json','utf8')).id)")
          else
            create_code=$(curl -s -o /tmp/created.json -w "%{http_code}" -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"\`$BRANCH\`: commit $SHA.\",\"target_commitish\":\"$SHA\",\"prerelease\":true}" \
              "$FORGEJO_API/repos/$REPO/releases")
            echo "POST create release -> HTTP $create_code"; cat /tmp/created.json; echo
            if [ "$create_code" = "201" ]; then
              release_id=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/created.json','utf8')).id)")
            else
              # All three branches push together and finish within seconds of each other, so
              # another branch can create this release between our GET and POST — confirmed
              # live (run 47): Forgejo answers that with HTTP 500 "tag ... already exists".
              # Re-read the release the other run just made and attach our jar to it instead.
              sleep 5
              retry_code=$(curl -s -o /tmp/existing.json -w "%{http_code}" -H "Authorization: token $TOKEN" \
                "$FORGEJO_API/repos/$REPO/releases/tags/$TAG")
              echo "Re-GET release tag $TAG -> HTTP $retry_code"; cat /tmp/existing.json; echo
              if [ "$retry_code" != "200" ]; then
                echo "::error::Failed to create release (HTTP $create_code) and none exists for $TAG"
                exit 1
              fi
              release_id=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/existing.json','utf8')).id)")
            fi
          fi
          echo "release_id=$release_id"

          # The jar filename contains a literal "+" (e.g. "...+build.70-all.jar") - confirmed
          # live that an un-encoded "+" in the ?name= query param gets interpreted as a space
          # by Forgejo, landing the asset as "...  build.70-all.jar" instead. encodeURIComponent
          # it properly rather than interpolating the raw name into the URL.
          jar_name_encoded=$(node -e "console.log(encodeURIComponent(process.env.JAR_NAME))")
          asset_code=$(curl -s -o /tmp/asset.json -w "%{http_code}" -X POST -H "Authorization: token $TOKEN" \
            -F "attachment=@${JAR_PATH};filename=${JAR_NAME}" \
            "$FORGEJO_API/repos/$REPO/releases/$release_id/assets?name=${jar_name_encoded}")
          echo "POST upload asset -> HTTP $asset_code"; cat /tmp/asset.json; echo
          if [ "$asset_code" != "201" ]; then
            echo "::error::Failed to upload release asset (HTTP $asset_code)"
            exit 1
          fi

      # Posts a rich embed to a Discord channel via webhook, linking straight to the Forgejo
      # release asset above — same pattern as the GitHub workflow's own "Post build to
      # Discord" step, adapted to Forgejo's API (browser_download_url straight from the asset
      # upload response, rather than reconstructing the URL by hand).
      # Requires a repo secret DISCORD_BUILDS_WEBHOOK_URL (Discord channel -> Edit Channel ->
      # Integrations -> Webhooks -> Copy URL). Skipped (not failed) if unset, so this workflow
      # doesn't break for anyone who hasn't configured it.
      # continue-on-error: a Discord outage shouldn't fail the actual release.
      - name: Post build to Discord
        continue-on-error: true
        env:
          DISCORD_BUILDS_WEBHOOK_URL: ${{ secrets.DISCORD_BUILDS_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          MOD_VERSION: ${{ steps.mod_version.outputs.value }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
          JAR_NAME: ${{ steps.jar.outputs.name }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
        run: |
          if [ -z "$DISCORD_BUILDS_WEBHOOK_URL" ]; then
            echo "DISCORD_BUILDS_WEBHOOK_URL not set - skipping Discord notification."
            exit 0
          fi

          DOWNLOAD_URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/asset.json','utf8')).browser_download_url)")
          SIZE_MB=$(node -e "console.log((require('fs').statSync(process.env.JAR_PATH).size / 1048576).toFixed(2))")
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          payload=$(DOWNLOAD_URL="$DOWNLOAD_URL" SIZE_MB="$SIZE_MB" TIMESTAMP="$TIMESTAMP" node -e "
            const branch = process.env.BRANCH;
            const releaseTitle = process.env.MOD_VERSION + ' — ' + branch + ' — build ' + process.env.BUILD_NUMBER;
            const jarName = process.env.JAR_NAME;
            const url = process.env.DOWNLOAD_URL;
            const size = process.env.SIZE_MB + ' MB';
            console.log(JSON.stringify({
              embeds: [{
                author: { name: 'NeoEssentials (Forgejo)' },
                title: '🆕 Dev Release',
                color: 5793266,
                url: url,
                fields: [ { name: 'Branch', value: branch, inline: true } ],
                description: '**' + releaseTitle + '**\n[' + jarName + '](' + url + ')\n' + size + ' • [Download](' + url + ')',
                timestamp: process.env.TIMESTAMP
              }]
            }));
          ")

          curl -sS -f \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_BUILDS_WEBHOOK_URL"
