# NeoEssentials - Gradle Properties
# IDE: IntelliJ IDEA Community Edition (recommended)
# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
# NOT USED on the 26.x port (this branch) — Mojang shipped real parameter names directly
# once obfuscation was removed in 26.1, so Parchment's parameter-name/javadoc layer is no
# longer needed there. Left here (commented) for when this branch is merged back / diffed
# against the 1.21.1 branch, which still needs it.
#parchment_minecraft_version=1.21.1
#parchment_mappings_version=2024.11.17

# ============================================================
# MULTI-VERSION BUILD TARGETS (Reference Table)
# ============================================================
# This mod is compiled against Minecraft 1.21.1 / NeoForge 21.1.179 (primary).
# The declared minecraft_version_range covers 1.21.1 through 1.21.10 (API-compatible).
# 1.21.11 and 26.x require dedicated port builds due to breaking API changes.
#
# To build for a different version, update the four properties below and rebuild.
#
# | Minecraft  | NeoForge (latest stable) | parchment_version | API Status           |
# |------------|--------------------------|-------------------|----------------------|
# | 1.21.1     | 21.1.179  (current)      | 2024.11.17        | PRIMARY ? SUPPORTED  |
# | 1.21.1     | 21.1.226  (latest 1.21.1)| 2024.11.17        | SUPPORTED (drop-in)  |
# | 1.21.4     | 21.4.136                 | (check parchment) | COMPATIBLE*          |
# | 1.21.5     | 21.5.96                  | (check parchment) | COMPATIBLE*          |
# | 1.21.8     | 21.8.52                  | (check parchment) | COMPATIBLE*          |
# | 1.21.10    | 21.10.63                 | (check parchment) | COMPATIBLE*          |
# | 1.21.11    | 21.11.42                 | (check parchment) | INCOMPATIBLE?        |
# | 26.1-26.1.2| 26.1.2.76 (current)      | n/a (see below)   | PRIMARY on 26.1.x    |
#
# * COMPATIBLE: No source changes required for server-side core features.
#               Vanish packet API (ClientboundAddEntityPacket) may need updating for 1.21.4+.
#               Runtime VersionCompatibilityChecker will log a notice on non-primary versions.
#
# ? INCOMPATIBLE (1.21.11): 100+ breaking API changes vs 1.21.1-1.21.10.
#   Known affected areas: registry access, Component API, entity spawn packets, event handlers.
#   Requires: create a 1.21.11 branch, compile against neo_version=21.11.42,
#             and resolve each compilation error from the NeoForge 1.21.11 changelogs.
#
# 26.1-26.1.2 (this branch): Mojang introduced a new versioning scheme (26.x), replacing the
#   old 1.21.x line. NeoForge 26.1.2.76 compiles against Minecraft 26.1.2 API. This branch is
#   pinned to the 26.1.x line only — see the 26.x branch for the rolling 26.2+ port, which
#   moved off 26.1.2 since it uses 26.2-exclusive symbols not present in the 26.1.2 jar.
#
# Per-version minecraft_version_range values:
#   1.21.1?1.21.10 : [1.21.1,1.21.11)    ? current on the 1.21.x branch
#   1.21.11 only   : [1.21.11,1.21.12)
#   26.1-26.1.2    : [26.1.0,26.2)       ? current on this (26.1.x) branch
# ============================================================

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
# This branch (26.1.x) is pinned to the 26.1-26.1.2 line only — see the 26.x branch for the
# rolling 26.2+ port, or the 1.21.x branch for the 1.21.1-1.21.10 primary build.
minecraft_version_range=[26.1.0,26.2)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.76

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=neoessentials
# The human-readable display name for the mod.
mod_name=neoessentials
# The license of the mod. Review your options at https://choosealicense.com/.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.0.5
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.zerog.neoessentials
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=MrWhiteFlamesYT
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=NeoEssentials is a mod that adds many useful commands and features to Minecraft servers. \nIt is designed to enhance the gameplay experience for both players and server administrators.
