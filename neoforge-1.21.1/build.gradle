plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.93'
    id 'idea'
}

archivesBaseName = 'neoessentials-neoforge-1.21.1'

// Get the build number from the root project
def getBuildNumber() {
    def propsFile = rootProject.file("buildnumber.properties")
    if (!propsFile.exists()) {
        propsFile.text = "buildNumber=1"
        return 1
    }
    
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    return props.getProperty("buildNumber").toInteger()
}

def buildNumber = getBuildNumber()
version = "${version}.${buildNumber}"

java {
    withSourcesJar()
    withJavadocJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21) // Use Java 21 for MC 1.21.1
}

// Create a task extension to hold version properties
abstract class VersionPropertiesExtension {
    abstract Property<String> getModVersion()
    abstract Property<String> getLoaderVersionRange()
    abstract Property<String> getNeoVersionRange()
    abstract Property<String> getMinecraftVersionRange()
}

// Add the extension to the project
def versionProps = extensions.create('versionProps', VersionPropertiesExtension)
versionProps.modVersion.set(version)
versionProps.loaderVersionRange.set("[1,)")
versionProps.neoVersionRange.set("[21.1,22)")
versionProps.minecraftVersionRange.set("[1.21.1]")

// NeoForge specific configuration
neoForge {
    version = "21.1.179"

    parchment {
        mappingsVersion = "2024.11.17"
        minecraftVersion = "1.21.1"
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'neoessentials'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'neoessentials'
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'neoessentials'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "neoessentials" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Configure processResources to replace version in mods.toml
tasks.processResources.configure {
    inputs.property("version", versionProps.modVersion)
    inputs.property("loader_version_range", versionProps.loaderVersionRange)
    inputs.property("neo_version_range", versionProps.neoVersionRange)
    inputs.property("minecraft_version_range", versionProps.minecraftVersionRange)
    
    filesMatching("META-INF/mods.toml") {
        expand(
            "version": versionProps.modVersion.get(),
            "loader_version_range": versionProps.loaderVersionRange.get(),
            "neo_version_range": versionProps.neoVersionRange.get(),
            "minecraft_version_range": versionProps.minecraftVersionRange.get()
        )
    }
}

// Dependencies
dependencies {
    // Add dependency on common module
    implementation project(':common')
    
    // Add your existing dependencies here
}

// Copy the existing mod's source code and resources to this module
// This task copies the existing mod sources into this module
tasks.register('importExistingMod', Copy) {
    description = 'Import existing mod sources into this module'
    
    from "${rootProject.projectDir}/src/main/java"
    into "${projectDir}/src/main/java"
    
    from "${rootProject.projectDir}/src/main/resources"
    into "${projectDir}/src/main/resources"
    
    from "${rootProject.projectDir}/src/generated/resources"
    into "${projectDir}/src/generated/resources"
}

// Setup task that helps prepare the module for development
tasks.register('setupModule', DefaultTask) {
    description = 'Setup this module with everything needed for development'
    
    dependsOn tasks.importExistingMod
    
    doLast {
        println "Module setup complete! The module now contains a copy of the existing mod code."
        println "You can now start adapting it for cross-version compatibility."
    }
}
