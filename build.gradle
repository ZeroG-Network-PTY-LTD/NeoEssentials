plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.131'
}

// Get the build number from buildnumber.properties
def getBuildNumber() {
    def propsFile = file("buildnumber.properties")
    if (!propsFile.exists()) {
        propsFile.text = "buildNumber=1"
        return 1
    }
    
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    return props.getProperty("buildNumber").toInteger()
}

def buildNumber = getBuildNumber()
version = "${mod_version}.${buildNumber}"
group = mod_group_id
archivesBaseName = mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
    withJavadocJar()
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Neo Forge license when using the 'official' or 'parchment' mappings.
    // See NETWORKING.md for more information.
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from Minecraft Forge.
    // Additional setup is needed to use their mappings, see https://parchmentmc.org/docs/getting-started
    mappings channel: 'official', version: '1.21.1'

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    
    copyIdeResources = true

    runs {
        // Apply these settings to all run configs
        configureEach {
            workingDirectory project.file('run')
            
            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'REGISTRIES'
            
            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
            
            mods {
                neoessentials {
                    source sourceSets.main
                }
            }
        }
        
        client {
            // Properties for client run config
        }

        server {
            // Properties for server run config
            args '--nogui'
        }

        gameTestServer {
            // Properties for game test server
        }

        data {
            // Properties for data generation run config
            workingDirectory project.file('run-data')
            
            args '--mod', 'neoessentials', '--all',
                '--output', file('src/generated/resources/'),
                '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.lucko.me/' } // For LuckPerms API
}

dependencies {
    // Use Neo Forge userdev for this version of Minecraft
    minecraft "net.neoforged:neoforge:${minecraft_version}-${neo_version}"
    
    // Database dependencies
    implementation 'org.xerial:sqlite-jdbc:3.44.1.0'
    implementation 'com.mysql:mysql-connector-j:8.2.0'
    
    // LuckPerms API (soft dependency for permission checking)
    compileOnly 'net.luckperms:api:5.4'
}

// Task to increment build number
tasks.register('incrementBuildNumber') {
    description = 'Increments the build number'
    
    doLast {
        def propsFile = file("buildnumber.properties")
        def props = new Properties()
        
        if (propsFile.exists()) {
            propsFile.withInputStream { props.load(it) }
        }
        
        def currentBuildNumber = props.getProperty("buildNumber", "0").toInteger() + 1
        props.setProperty("buildNumber", currentBuildNumber.toString())
        
        propsFile.withOutputStream { 
            props.store(it, "Build number updated") 
        }
        
        println "Build number incremented to: ${currentBuildNumber}"
    }
}

// Make sure the build number is incremented when we build
build.finalizedBy tasks.incrementBuildNumber

// Jar configuration
jar {
    manifest {
        attributes([
            'Specification-Title'     : 'NeoEssentials',
            'Specification-Vendor'    : 'ZeroG',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'ZeroG',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    
    finalizedBy 'reobfJar'
}

// Publishing configuration
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            
            pom {
                name = 'NeoEssentials'
                description = 'Essential server-side commands and utilities for NeoForge servers'
                url = 'https://github.com/zerog/neoessentials'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'zerog'
                        name = 'ZeroG'
                    }
                }
            }
        }
    }
    
    repositories {
        maven {
            name = "localRepo"
            url = "file://${project.buildDir}/repo"
        }
    }
}
