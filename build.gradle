import org.gradle.api.DefaultTask
import org.gradle.api.tasks.TaskAction

// Use a simpler approach that's compatible with configuration cache
def getBuildNumber() {
    def propsFile = file("buildnumber.properties")
    if (!propsFile.exists()) {
        propsFile.text = "buildNumber=1"
        return 1
    }
    
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    return props.getProperty("buildNumber").toInteger()
}

