// Task to increment build number compatible with configuration cache
abstract class IncrementBuildNumberTask extends DefaultTask {
    @InputFile
    @Optional
    abstract RegularFileProperty getPropertiesFile()
    
    @OutputFile
    abstract RegularFileProperty getOutputFile()
    
    @TaskAction
    def increment() {
        File propsFile = getOutputFile().getAsFile().get()
        Properties props = new Properties()
        
        // If the input properties file is provided and exists, load from it
        File inputFile = getPropertiesFile().getAsFile().getOrNull()
        if (inputFile != null && inputFile.exists()) {
            inputFile.withInputStream { stream ->
                props.load(stream)
            }
        } else if (propsFile.exists()) {
            // Otherwise load from the output file if it exists
            propsFile.withInputStream { stream ->
                props.load(stream)
            }
        } else {
            // Create the parent directory if it doesn't exist
            if (!propsFile.getParentFile().exists()) {
                propsFile.getParentFile().mkdirs()
            }
            
            // Initialize with default values if no file exists
            props.setProperty("lastBuildNumber", "0")
            props.setProperty("buildNumber", "0")
        }
        
        int lastBuildNumber = (props.getProperty("buildNumber", "0") as String).toInteger()
        int currentBuildNumber = lastBuildNumber + 1
        
