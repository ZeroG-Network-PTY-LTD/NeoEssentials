plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.93'
    id 'idea'
}

// Globally exclude all Log4j dependencies from all configurations

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = "CurseForge"
        url = uri("https://maven.curseforge.com")
    }
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
    }
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://repo.lucko.me/' }
    maven {
        url "https://maven.firstdark.dev/releases"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        server {
            server()
            programArgument '--nogui'
        }
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        neoessentials {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Uncomment and resolve all conflicts before using failOnVersionConflict
// configurations.all {
//     resolutionStrategy {
//         failOnVersionConflict()
//     }
// }

dependencies {
    // SDLink Discord integration
    implementation "com.hypherionmc.sdlink:sdlink:3.3.2"
    implementation "com.hypherionmc.craterlib:CraterLib-NeoForge-1.21:2.1.5"

    // Bundle SnakeYAML with the mod, but prefer server-provided version if present
    implementation('org.yaml:snakeyaml:2.2')
    // Compile SnakeYAML as a normal dependency
    implementation('org.xerial:sqlite-jdbc:3.44.1.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    compileOnly('com.mysql:mysql-connector-j:8.3.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    compileOnly 'net.luckperms:api:5.4'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'

    // Log4j dependencies required by NeoForge
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


jar {
    manifest {
        attributes(
            'Specification-Title': 'NeoEssentials',
            'Specification-Vendor': 'ZeroG',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'ZeroG'
        )
    }
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
