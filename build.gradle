// Improved BuildNumber handling with Configuration Cache compatibility

abstract class BuildNumberProvider implements ValueSource<Integer, BuildNumberParameters> {
    interface BuildNumberParameters extends ValueSourceParameters {
        Property<File> getPropertiesFile()
    }

    @Override
    Integer obtain() {
        File propsFile = parameters.propertiesFile.get()
        if (!propsFile.exists()) {
            // Default to 1 if the file doesn't exist
            return 1
        }

        Properties props = new Properties()
        propsFile.withInputStream { stream ->
            props.load(stream)
        }
        return (props.getProperty("buildNumber", "1") as String).toInteger()
    }
}

// Get the build number using a configuration-cache compatible provider
def buildNumber = providers.of(BuildNumberProvider) { 
    parameters.propertiesFile.set(file("buildnumber.properties"))
}.get()

// Update the version to include the build number
version = "${mod_version}.${buildNumber}"
println "Building NeoEssentials version: ${version}"

// Task to increment build number compatible with configuration cache
abstract class IncrementBuildNumberTask extends DefaultTask {
    @InputFile
    @Optional
    abstract RegularFileProperty getPropertiesFile()
    
    @OutputFile
    abstract RegularFileProperty getOutputFile()
    
    @TaskAction
    def increment() {
        File propsFile = getPropertiesFile().getAsFile().getOrNull() ?: getOutputFile().getAsFile().get()
        Properties props = new Properties()
        
        if (propsFile.exists()) {
            propsFile.withInputStream { stream ->
                props.load(stream)
            }
        }
        
        int currentBuildNumber = (props.getProperty("buildNumber", "0") as String).toInteger() + 1
        props.setProperty("buildNumber", currentBuildNumber.toString())
        
        getOutputFile().getAsFile().get().withOutputStream { stream ->
            props.store(stream, "Build number updated") 
        }
        
        println "Build number incremented to: ${currentBuildNumber}"
    }
}

// Register the task
tasks.register('incrementBuildNumber', IncrementBuildNumberTask) {
    description = 'Increments the build number'
    propertiesFile.set(file("buildnumber.properties"))
    outputFile.set(file("buildnumber.properties"))
}

// Make sure the build number is incremented when we build
tasks.named('build').configure {
    finalizedBy tasks.named('incrementBuildNumber')
}
