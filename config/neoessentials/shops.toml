# NeoEssentials Shops Configuration (see plan above for details)
[general]
allowAdminShops = true
defaultTaxRate = 0.00
allowHopperInteraction = false
linkingItem = "minecraft:redstone"

[formats]
shopHeader = ["[shop]", "[buy]", "[sell]"]
amountLine = 2
priceLine  = 3
itemLine   = 4

[validation]
maxPrice = 1.0E9
maxAmount = 3456
allowHexColors = true

[permissions]
create = "neoessentials.shops.create"
admin  = "neoessentials.shops.admin"
use    = "neoessentials.shops.use"
