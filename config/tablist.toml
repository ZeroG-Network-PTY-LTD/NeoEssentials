# Example config for NeoEssentials tablist header/footer animation

[header]
lines = [
    "&6Welcome &f%displayname%",
    "&7Server: &a%server_name%"
]
animation_interval_ms = 800
use_placeholders = true

[footer]
lines = [
    "&7Players: &e%server_players%/%server_max_players%",
    "&7Ping: &a%ping%"
]
animation_interval_ms = 1000
